name: Publish release downloads
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish or verify
        required: true
        type: string
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-gifs.txt
      - run: npm run release
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const tag = context.payload.inputs?.tag || context.ref.replace('refs/tags/', '');
            const body = fs.readFileSync('sharing/RELEASE.md', 'utf8');
            let release;
            try {
              release = await github.rest.repos.getReleaseByTag({ ...context.repo, tag });
            } catch (error) {
              if (error.status !== 404) throw error;
              release = await github.rest.repos.createRelease({
                ...context.repo, tag_name: tag, name: `${tag} - Pixel mascot story collection`, body
              });
            }
            const existing = new Set(release.data.assets.map(asset => asset.name));
            for (const name of ['mascot-assets.zip', 'mascot-gifs.zip', 'mascot-studio.zip', 'mascot-studio-source.zip', 'mascot-showcase.gif', 'reddit-mascot-showcase.gif', 'fluid-showcase.gif', 'gag-showcase.gif']) {
              if (existing.has(name)) { core.info(`${name} is already uploaded`); continue; }
              const data = fs.readFileSync(`release/${name}`);
              await github.rest.repos.uploadReleaseAsset({
                ...context.repo, release_id: release.data.id, name, data,
                headers: { 'content-type': name.endsWith('.gif') ? 'image/gif' : 'application/zip', 'content-length': data.length }
              });
            }
